name: Temporary Scraper Run

on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      - name: Start Scraper and Expose Endpoint
        run: |
          # 1. Start the scraper app in the background
          npm start &
          
          # 2. Wait 5 seconds for the app to fully boot up
          sleep 5
          
          # 3. Install localtunnel globally and open a public tunnel on the app's port
          # Note: Change '3000' below if the Anivault-Scraper runs on a different port (like 5000 or 8080)
          npx localtunnel --port 3000
