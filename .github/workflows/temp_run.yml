name: Temporary Scraper Run

on:
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build TypeScript Code
        run: npm run build

      - name: Start App and Expose Raw Endpoint
        run: |
          echo "🚀 Starting app matching Railway configurations..."
          # Enforce Railway's default port rule for container builds
          export PORT=8080
          npm start &
          
          echo "⏳ Letting server bind..."
          sleep 5
          
          echo "🔗 Installing and launching Bore raw tunnel..."
          # Download and unpack the lightweight Bore binary
          curl -sL https://github.com | sudo tar -xzf - -C /usr/local/bin/
          
          # Match the port to the app instance environment variable (8080)
          bore local 8080 --to bore.pub
