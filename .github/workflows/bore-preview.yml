name: Expose API via Cloudflare (No Warning Pages)

on:
  workflow_dispatch:

jobs:
  run-and-expose:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Project Dependencies
      run: npm install

    - name: Install Cloudflare Tunnel Client
      run: |
        echo "Installing cloudflared CLI..."
        curl -L --output cloudflared.deb https://github.com
        sudo dpkg -i cloudflared.deb
        cloudflared --version

    - name: Start API Server & Expose via Cloudflare
      run: |
        if [ -f env.example ]; then cp env.example .env; fi
        
        # 1. Spin up the Express API server in the background (port 3000)
        npm run dev &
        sleep 5
        
        echo "=========================================================="
        echo "🚀 GENERATING A WARNING-FREE CLOUDFLARE ENDPOINT..."
        echo "Look at the logs below to grab your dynamic trycloudflare.com link!"
        echo "=========================================================="
        
        # 2. Open an anonymous tunnel routing directly to your Express app port
        timeout 60m cloudflared tunnel --url http://localhost:3000
